        if (body) body.innerHTML = "<div style='font-size:13px;color:#64748b'>Cargando historial...</div>";
        try {
          var url = "/api/credito-client-form-recent?clientId=" + encodeURIComponent(clientId);
          var res = await fetch(url, { cache: "no-store" });
          var out = await res.json().catch(function () { return {}; });
          if (!res.ok || !out.ok) throw new Error((out && out.error) || ("HTTP " + res.status));
          var pendingN = typeof out.pendingCount === "number" ? out.pendingCount : 0;
          if (sub) {
            sub.textContent =
              (clientName || "Cliente") +
              " · " +
              clientId +
              (pendingN ? " · " + pendingN + " borrador(es) pendientes" : "");
          }
          var items = Array.isArray(out.items) ? out.items : [];
          if (!items.length) {
            if (body) body.innerHTML = "<div style='font-size:13px;color:#64748b'>No hay formularios/cobros/garantias para este cliente aun.</div>";
            return;
          }
          if (!body) return;
          body.innerHTML = items.map(function (it) {
            var note = it.note ? String(it.note) : "";
            var st = String(it.source || "");
            var ap = String(it.approvalStatus || "");
            var extras = "";
            if (st === "credito_client_form_submissions") {
              extras +=
                "<div style='margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;'>" +
                approvalPill(ap || "pending_review") +
                "</div>";
            }
            var proofBtn = "";
            if (it.proof) {
              var proofHref =
                it.source === "credito_client_form_submissions" && it.submissionId
                  ? "/api/credito-client-form-proof?submissionId=" + encodeURIComponent(it.submissionId) + "&clientId=" + encodeURIComponent(clientId)
                  : encodeURI(String(it.proof));
              proofBtn =
                "<button type='button' data-hm-proof-preview='1' data-proof-url=\"" + escapeHtmlQuick(proofHref) + "\" "
                  + "style='font-size:12px;font-weight:700;color:#0ea5e9;background:none;border:none;padding:0;cursor:pointer;text-decoration:underline;font-family:inherit'>"
                  + "Ver comprobante</button>";
            }
            var actionsHtml = "";
            if (it.actionable && it.submissionId) {
              actionsHtml +=
                "<div style='margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;'>"
                  + "<button type='button' data-hm-form-act='accept' data-submission-id='" + escapeHtmlQuick(it.submissionId) + "' "
                  + "style='height:32px;padding:0 12px;border-radius:8px;border:none;background:#16a34a;color:#fff;font-weight:700;font-size:12px;cursor:pointer'>Aceptar</button>"
                  + "<button type='button' data-hm-form-act='reject_open' data-submission-id='" + escapeHtmlQuick(it.submissionId) + "' "
                  + "style='height:32px;padding:0 12px;border-radius:8px;border:1px solid #fecaca;background:#fef2f2;color:#991b1b;font-weight:700;font-size:12px;cursor:pointer'>Rechazar</button>"
                  + "<button type='button' data-hm-form-act='reqedit_open' data-submission-id='" + escapeHtmlQuick(it.submissionId) + "' "
                  + "style='height:32px;padding:0 12px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;color:#0f172a;font-weight:700;font-size:12px;cursor:pointer'>Pedir corregir</button>"
                  + "</div>"
                  + "<div class='hm-panel-reject' style='display:none;margin-top:10px;padding:12px;border-radius:10px;background:#fef2f2;border:1px solid #fecaca'>"
                  + "<label style='display:block;font-size:12px;font-weight:700;color:#991b1b;margin-bottom:6px'>Motivo del rechazo (opcional)</label>"
                  + "<textarea class='hm-reject-msg' rows='2' placeholder='Ej. comprobante ilegible, monto no coincide…' "
                  + "style='width:100%;box-sizing:border-box;border:1px solid #fca5a5;border-radius:8px;padding:8px;font-size:13px;resize:vertical'></textarea>"
                  + "<div style='display:flex;flex-wrap:wrap;gap:8px;margin-top:10px'>"
                  + "<button type='button' data-hm-form-act='reject_submit' data-submission-id='" + escapeHtmlQuick(it.submissionId) + "' "
                  + "style='height:32px;padding:0 14px;border-radius:8px;border:none;background:#991b1b;color:#fff;font-weight:700;font-size:12px;cursor:pointer'>Confirmar rechazo</button>"
                  + "<button type='button' data-hm-form-act='reject_cancel' style='height:32px;padding:0 12px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;color:#64748b;font-weight:700;font-size:12px;cursor:pointer'>Cancelar</button>"
                  + "</div></div>"
                  + "<div class='hm-panel-reqedit' style='display:none;margin-top:10px;padding:12px;border-radius:10px;background:#f8fafc;border:1px solid #e2e8f0'>"
                  + "<label style='display:block;font-size:12px;font-weight:700;color:#334155;margin-bottom:6px'>Qué debe corregir el cliente</label>"
                  + "<textarea class='hm-reqedit-msg' rows='3' placeholder='Ej. subir comprobante más claro, corregir monto o fecha…' "
                  + "style='width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:8px;padding:8px;font-size:13px;resize:vertical'></textarea>"
                  + "<div style='display:flex;flex-wrap:wrap;gap:8px;margin-top:10px'>"
                  + "<button type='button' data-hm-form-act='request_edit_submit' data-submission-id='" + escapeHtmlQuick(it.submissionId) + "' "
                  + "style='height:32px;padding:0 14px;border-radius:8px;border:none;background:#1d4ed8;color:#fff;font-weight:700;font-size:12px;cursor:pointer'>Enviar pedido al cliente</button>"
                  + "<button type='button' data-hm-form-act='reqedit_cancel' style='height:32px;padding:0 12px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;color:#64748b;font-weight:700;font-size:12px;cursor:pointer'>Cancelar</button>"
                  + "</div></div>";
            } else if (st === "credito_client_form_submissions" && ap === "needs_client_edit" && it.submissionId) {
              var mfCor = String(it.managerFeedback != null ? it.managerFeedback : "");
              actionsHtml +=
                "<div style='margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;'>"
                  + "<button type='button' data-hm-form-act='notice_copy' data-notice-kind='correction' data-submission-id='" + escapeHtmlQuick(it.submissionId) + "' "
                  + "data-manager-fb=\"" + encodeURIComponent(mfCor.slice(0, 1500)) + "\" "
                  + "style='height:34px;padding:0 14px;border-radius:8px;border:1px solid #1d4ed8;background:#1d4ed8;color:#fff;font-weight:700;font-size:12px;cursor:pointer'>Copiar aviso (corrección)</button>"
                  + "</div>";
            } else if (st === "credito_client_form_submissions" && ap === "accepted" && it.submissionId) {
              actionsHtml +=
                "<div style='margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;'>"
                  + "<button type='button' data-hm-form-act='notice_copy' data-notice-kind='accepted' data-submission-id='" + escapeHtmlQuick(it.submissionId) + "' "
                  + "style='height:34px;padding:0 14px;border-radius:8px;border:1px solid #16a34a;background:#f0fdf4;color:#15803d;font-weight:700;font-size:12px;cursor:pointer'>Copiar mensaje (aprobado)</button>"
                  + "</div>";
            } else if (st === "credito_client_form_submissions" && ap === "rejected" && it.submissionId) {
              var mfRej = String(it.managerFeedback != null ? it.managerFeedback : "");
              actionsHtml +=
                "<div style='margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;'>"
                  + "<button type='button' data-hm-form-act='notice_copy' data-notice-kind='rejected' data-submission-id='" + escapeHtmlQuick(it.submissionId) + "' "
                  + "data-manager-fb=\"" + encodeURIComponent(mfRej.slice(0, 1500)) + "\" "
                  + "style='height:34px;padding:0 14px;border-radius:8px;border:1px solid #dc2626;background:#fef2f2;color:#991b1b;font-weight:700;font-size:12px;cursor:pointer'>Copiar mensaje (rechazado)</button>"
                  + "</div>";
            }
            return ""
              + "<article style='border:1px solid #e5e7eb;border-radius:12px;padding:10px 12px;background:#fff;'>"
              + "  <div style='display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;'>"
              + "    <div style='display:flex;align-items:center;gap:8px;flex-wrap:wrap;'>" + typeBadge(it.kind || "formulario") + "<strong style='font-size:13px;color:#0f172a'>" + fmtMoney(it.amount) + "</strong></div>"
              + "    <span style='font-size:12px;color:#64748b'>" + fmtDate(it.date) + "</span>"
              + "  </div>"
              + extras
              + "  <div style='margin-top:8px;font-size:12px;color:#475569;line-height:1.45;'>" + (note ? escapeHtmlQuick(note) : "Sin detalle") + "</div>"
              + "  <div style='margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;'>"
              + "    <span style='font-size:11px;color:#94a3b8'>Fuente: " + escapeHtmlQuick(String(it.source || "—")) + "</span>"
              + "    "
              + proofBtn
              + "  </div>"
              + actionsHtml
              + "</article>";
          }).join("");
        } catch (err) {
          if (body) body.innerHTML = "<div style='font-size:13px;color:#b91c1c'>No se pudo cargar el historial: " + (err && err.message ? escapeHtmlQuick(err.message) : "error") + "</div>";
        }
      }
      function ensureActionButtons() {
        var clientId = parseClientIdFromHash();
        var passBtn = document.getElementById(BTN_ID);
        var viewBtn = document.getElementById(BTN_VIEW_ID);
        if (!clientId) {
          if (passBtn && passBtn.parentNode) passBtn.parentNode.removeChild(passBtn);
          if (viewBtn && viewBtn.parentNode) viewBtn.parentNode.removeChild(viewBtn);
          return;
        }
        if (passBtn && viewBtn) {
          var name0 = readClientName();
          passBtn.dataset.clientId = clientId;
          passBtn.dataset.clientLink = buildClientFormLink(clientId);
          viewBtn.dataset.clientId = clientId;
          viewBtn.dataset.clientName = name0 || "";
          return;
        }
        var anchor = findActionAnchor();
        if (!anchor || !anchor.parentElement) return;
        if (!passBtn) {
          passBtn = document.createElement("button");
          passBtn.id = BTN_ID;
          passBtn.type = "button";
          passBtn.textContent = "Pasar link";
          passBtn.style.cssText = "height:36px;padding:0 14px;border-radius:10px;border:1px solid #d0d7e2;background:#eef6ff;color:#1358b5;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;margin-left:8px";
          passBtn.addEventListener("click", async function () {
            var link = passBtn.dataset.clientLink || buildClientFormLink(passBtn.dataset.clientId || "");
            if (!link) return;
            var copied = await copyText(link);
            if (copied) showToast("Link copiado para este cliente");
            else window.prompt("Copiá y pasá este link al cliente:", link);
          });
          anchor.parentElement.appendChild(passBtn);
        }
        if (!viewBtn) {
          viewBtn = document.createElement("button");
          viewBtn.id = BTN_VIEW_ID;
          viewBtn.type = "button";
          viewBtn.textContent = "Ver formularios";
          viewBtn.style.cssText = "height:36px;padding:0 14px;border-radius:10px;border:1px solid #d0d7e2;background:#f8fafc;color:#0f172a;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;margin-left:8px";
          viewBtn.addEventListener("click", function () {
            openFormsModal(viewBtn.dataset.clientId || "", viewBtn.dataset.clientName || "");
          });
          anchor.parentElement.appendChild(viewBtn);
        }
        var name = readClientName();
        passBtn.dataset.clientId = clientId;
        passBtn.dataset.clientLink = buildClientFormLink(clientId);
        viewBtn.dataset.clientId = clientId;
        viewBtn.dataset.clientName = name || "";
      }
      function install() {
        initProofLightboxOnce();
        ensureActionButtons();
        window.addEventListener("hashchange", ensureActionButtons);
        window.addEventListener("popstate", ensureActionButtons);
        setInterval(ensureActionButtons, 1200);
        if (!window[OBS_KEY]) {
          window[OBS_KEY] = new MutationObserver(function () {
            ensureActionButtons();
          });
          window[OBS_KEY].observe(document.documentElement, { childList: true, subtree: true });
        }
      }
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", install);
      } else {
        install();
      }
    })();
  </script>

  <link rel="shortcut icon" type="image/png" href="/credito-app/favicon/favicon.png?v=3" />
</head>
